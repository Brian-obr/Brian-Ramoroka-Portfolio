# Lint, build, typecheck and the Playwright tests on every pull request and every push to main.
# The screenshot comparison (npm run verify) needs a local reference capture, so it runs locally only.
name: checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  checks:
    # Pinned: Playwright's browser dependencies install cleanly on 24.04; ubuntu-latest is moving to 26.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # Dummy container ID so the consent tests can see the tag load (requests are stubbed).
      NEXT_PUBLIC_GTM_ID: GTM-TEST000
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      # Build before typecheck: tsc reads the route types the build writes to .next/types.
      - run: npm run build
      - run: npm run typecheck
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
